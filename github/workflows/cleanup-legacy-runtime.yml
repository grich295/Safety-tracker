name: One-time Safety Tracker legacy runtime cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove obsolete runtime builds safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive
          removed_file="$(mktemp)"

          should_remove() {
            local f="$1"
            local b
            b="$(basename "$f")"
            case "$b" in
              app-*.js) [[ "$b" != "app-v21028.js" ]] ;;
              sw-*.js) [[ "$b" != "sw-v21028.js" ]] ;;
              styles-*.css) [[ "$b" != "styles-v21019.css" ]] ;;
              bulk-*.js) [[ "$b" != "bulk-import-v21028.js" ]] ;;
              demo-*.js) [[ "$b" != "demo-v2100.js" ]] ;;
              hotfix-*.js) [[ "$b" != "hotfix-v21046-baseline.js" ]] ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r -d '' f; do
            if should_remove "$f"; then
              printf '%s\n' "${f#./}" >> "$removed_file"
              git rm -- "$f"
            fi
          done < <(find . -maxdepth 1 -type f \( \
              -name 'app-*.js' -o \
              -name 'sw-*.js' -o \
              -name 'styles-*.css' -o \
              -name 'bulk-*.js' -o \
              -name 'demo-*.js' -o \
              -name 'hotfix-*.js' \
            \) -print0)

          sort -o "$removed_file" "$removed_file"
          count="$(wc -l < "$removed_file" | tr -d ' ')"

          {
            echo "# Legacy runtime build cleanup"
            echo
            echo "Safety Tracker repository housekeeping after v2.10.46 CLEAN was verified live."
            echo
            echo "The files below were removed from the repository root because the live app no longer references them."
            echo "They remain recoverable from Git history."
            echo
            echo "## Active runtime files intentionally retained"
            echo
            echo "- index.html"
            echo "- app-v21028.js"
            echo "- hotfix-v21046-baseline.js"
            echo "- bulk-import-v21028.js"
            echo "- demo-v2100.js"
            echo "- styles-v21019.css"
            echo "- sw-v21028.js"
            echo "- version.json"
            echo "- config.js"
            echo "- manifest.webmanifest"
            echo
            echo "Historical SQL/migration files and documentation were deliberately left untouched."
            echo
            echo "## Removed legacy runtime files"
            echo
            sed 's/^/- /' "$removed_file"
            echo
            echo "Total removed from the current root: ${count} files."
          } > archive/LEGACY-RUNTIME-BUILDS.md

          git add archive/LEGACY-RUNTIME-BUILDS.md

          if [[ -f ".github/workflows/cleanup-legacy-runtime.yml" ]]; then
            git rm ".github/workflows/cleanup-legacy-runtime.yml"
          fi

          echo "Removed ${count} obsolete runtime files."

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive obsolete Safety Tracker runtime builds"
          git push origin HEAD:main
